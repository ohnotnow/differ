<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Differ</title>
    <link rel="stylesheet" href="./assets/differ.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <aside class="sidebar" aria-label="Changed files">
        <header class="sidebar-header">
          <span class="label">Working Tree</span>
          <strong id="change-count">0 changes</strong>
        </header>

        <div id="tree-host" class="tree-host"></div>

        <nav id="fallback-files" class="fallback-files" aria-label="Changed file shortcuts"></nav>
      </aside>

      <div
        id="panel-resizer"
        class="panel-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize file list"
        title="Drag to resize · double-click to reset"
        tabindex="0"
      ></div>

      <section class="diff-surface" aria-label="Diff">
        <header class="diff-header">
          <div class="diff-title-block">
            <span class="label">Diff</span>
            <h1 id="selection-title">All changes</h1>
          </div>

          <div class="controls">
            <div class="theme-control" aria-label="Theme">
              <select id="theme-select" class="theme-select" title="Theme" aria-label="Theme">
                <option value="pierre-dark">Pierre Dark</option>
                <option value="pierre-dark-soft">Pierre Dark Soft</option>
                <option value="nord">Nord</option>
                <option value="github-dark">GitHub Dark</option>
                <option value="tokyo-night">Tokyo Night</option>
                <option value="gruvbox-dark-medium">Gruvbox Dark</option>
                <option value="catppuccin-mocha">Catppuccin Mocha</option>
              </select>
            </div>

            <div class="zoom-control" aria-label="Text zoom">
              <span class="control-icon" aria-hidden="true" title="Text zoom">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 15.75-2.489-2.489m0 0a3.375 3.375 0 1 0-4.773-4.773 3.375 3.375 0 0 0 4.774 4.774ZM21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
              </span>
              <select id="zoom-select" class="zoom-select" title="Zoom level" aria-label="Zoom level">
                <option value="80">80%</option>
                <option value="90">90%</option>
                <option value="100" selected>100%</option>
                <option value="110">110%</option>
                <option value="120">120%</option>
                <option value="130">130%</option>
                <option value="140">140%</option>
                <option value="150">150%</option>
                <option value="160">160%</option>
                <option value="170">170%</option>
                <option value="180">180%</option>
                <option value="200">200%</option>
              </select>
            </div>

            <label class="interval-control" aria-label="Refresh interval">
              <span class="control-icon" aria-hidden="true" title="Refresh interval">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
              </span>
              <select id="refresh-interval" aria-label="Refresh interval">
                <option value="2000">2s</option>
                <option value="5000" selected>5s</option>
                <option value="10000">10s</option>
                <option value="30000">30s</option>
              </select>
            </label>

            <button
              id="auto-refresh"
              class="button toggle-button"
              type="button"
              aria-pressed="true"
              title="Turn off auto-refresh"
            >
              Auto
            </button>
          </div>
        </header>

        <div id="diff-host" class="diff-host"></div>
      </section>
    </main>

    <script src="./assets/differ.js"></script>
  </body>
</html>
